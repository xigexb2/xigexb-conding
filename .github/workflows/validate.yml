name: Validate skill

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 获取仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: 检查规范与链接
        run: python -X utf8 scripts/check_repo.py . --require-skill
      - name: 安装元数据检查依赖
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: 严格验证元数据与 YAML
        run: python -X utf8 scripts/validate_skill.py .
      - name: 验证检查器
        run: python -X utf8 -m unittest discover -s tests -v
